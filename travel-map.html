<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Map | Xingtong Lin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        .travel-map-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .map-title {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 2rem;
            color: #fff;
        }
        
        .globe-container {
            position: relative;
            width: 100%;
            height: 600px;
            background: radial-gradient(circle, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #globe-canvas {
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }
        
        .globe-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 1rem;
            border-radius: 10px;
            color: white;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }
        
        .globe-controls h4 {
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
        }
        
        .globe-controls p {
            margin: 0.2rem 0;
            opacity: 0.8;
        }
        
        .travel-marker {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff6b6b;
            border: 3px solid white;
            border-radius: 50%;
            cursor: pointer;
            animation: markerPulse 2s infinite;
            z-index: 10;
        }
        
        @keyframes markerPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255, 107, 107, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }
        
        .marker-tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            font-size: 0.9rem;
            white-space: nowrap;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .marker-tooltip.show {
            opacity: 1;
        }
        
        .countries-panel {
            display: none;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
        }
        
        .countries-panel.active {
            display: block;
        }
        
        .countries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .country-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .country-card:hover {
            transform: translateY(-5px);
            border-color: #4ecdc4;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        
        .country-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        
        .country-flag {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        .places-panel {
            display: none;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
        }
        
        .places-panel.active {
            display: block;
        }
        
        .places-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .place-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
        }
        
        .place-name {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #fff;
        }
        
        .photo-gallery {
            position: relative;
            margin: 1rem 0;
        }
        
        .photo-container {
            display: flex;
            overflow: hidden;
            border-radius: 10px;
            position: relative;
        }
        
        .photo-slide {
            min-width: 100%;
            display: flex;
            gap: 0.5rem;
            transition: transform 0.3s ease;
        }
        
        .photo-item {
            flex: 1;
            height: 200px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .photo-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        
        .photo-nav:hover {
            background: rgba(0,0,0,0.9);
            transform: translateY(-50%) scale(1.1);
        }
        
        .photo-nav.prev {
            left: 10px;
        }
        
        .photo-nav.next {
            right: 10px;
        }
        
        .photo-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .coming-soon {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #ccc;
            font-style: italic;
        }
        
        .back-button {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        @media (max-width: 768px) {
            .travel-map-container {
                padding: 1rem;
            }
            
            .map-title {
                font-size: 2rem;
            }
            
            .world-map {
                height: 400px;
            }
            
            .continent {
                font-size: 1rem;
            }
            
            .asia { width: 80px; height: 80px; }
            .europe { width: 70px; height: 70px; }
            .africa { width: 80px; height: 80px; }
            .north-america { width: 90px; height: 90px; }
            .south-america { width: 70px; height: 70px; }
            .oceania { width: 60px; height: 60px; }
            .antarctica { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>
    <header class="glass-effect">
        <nav style="background:linear-gradient(90deg,#3a3f51 0%,#6a82fb 100%);">
            <div class="nav-container">
                <div class="nav-left">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="about.html" class="nav-link">About Me</a>
                    <a href="portfolio.html" class="nav-link">Portfolio</a>
                    <a href="contact.html" class="nav-link">Contact</a>
                </div>
                <div class="nav-right">
                    <button class="language-switch" onclick="switchLanguage()">
                        <span class="current-lang">EN</span>
                    </button>
                    <a href="https://www.instagram.com/louisalxt" target="_blank" class="social-icon">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/lxt/" target="_blank" class="social-icon">
                        <i class="fab fa-linkedin"></i>
                    </a>
                </div>
            </div>
        </nav>
    </header>
    
    <main>
        <div class="travel-map-container">
            <h1 class="map-title">
                <span class="en">My Travel Map</span>
                <span class="zh" style="display:none;">我的旅行地图</span>
            </h1>
            
            <div class="globe-container">
                <canvas id="globe-canvas"></canvas>
                <div class="globe-controls">
                    <h4>
                        <span class="en">Controls</span>
                        <span class="zh" style="display:none;">控制</span>
                    </h4>
                    <p>
                        <span class="en">🖱️ Drag to rotate</span>
                        <span class="zh" style="display:none;">🖱️ 拖拽旋转</span>
                    </p>
                    <p>
                        <span class="en">🔍 Scroll to zoom</span>
                        <span class="zh" style="display:none;">🔍 滚轮缩放</span>
                    </p>
                    <p>
                        <span class="en">📍 Click markers</span>
                        <span class="zh" style="display:none;">📍 点击标记</span>
                    </p>
                </div>
            </div>
            
            <div class="countries-panel" id="countries-panel">
                <button class="back-button" onclick="showMap()">
                    <span class="en">← Back to Map</span>
                    <span class="zh" style="display:none;">← 返回地图</span>
                </button>
                <h2 id="continent-title"></h2>
                <div class="countries-grid" id="countries-grid"></div>
            </div>
            
            <div class="places-panel" id="places-panel">
                <button class="back-button" onclick="showCountries()">
                    <span class="en">← Back to Countries</span>
                    <span class="zh" style="display:none;">← 返回国家</span>
                </button>
                <h2 id="country-title"></h2>
                <div class="places-grid" id="places-grid"></div>
            </div>
        </div>
    </main>
    
    <footer class="glass-effect">
        <div class="footer-content">
            <p class="blessing">May your future be filled with endless possibilities</p>
            <p class="blessing-zh" style="display:none;">愿你得偿所愿</p>
            <p class="copyright">© 2025 Xingtong Lin. All rights reserved.</p>
        </div>
    </footer>
    
    <script src="js/main.js"></script>
    <script src="js/travel-map.js"></script>
</body>
</html>
