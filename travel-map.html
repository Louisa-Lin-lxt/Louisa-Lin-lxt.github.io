<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Map | Xingtong Lin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .travel-map-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .map-title {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 2rem;
            color: #fff;
        }
        
        .world-map {
            position: relative;
            width: 100%;
            height: 500px;
            background: radial-gradient(circle, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 2rem;
        }
        
        .continent {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        
        .continent:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        
        .continent.visited {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            animation: pulse 2s infinite;
        }
        
        .continent.not-visited {
            background: linear-gradient(45deg, #666, #999);
            opacity: 0.5;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 107, 107, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }
        
        /* 大洲位置 */
        .asia { top: 20%; left: 60%; width: 120px; height: 120px; }
        .europe { top: 15%; left: 45%; width: 100px; height: 100px; }
        .africa { top: 35%; left: 48%; width: 110px; height: 110px; }
        .north-america { top: 20%; left: 15%; width: 130px; height: 130px; }
        .south-america { top: 50%; left: 25%; width: 100px; height: 100px; }
        .oceania { top: 60%; left: 75%; width: 90px; height: 90px; }
        .antarctica { top: 80%; left: 50%; width: 80px; height: 80px; }
        
        .countries-panel {
            display: none;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
        }
        
        .countries-panel.active {
            display: block;
        }
        
        .countries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .country-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .country-card:hover {
            transform: translateY(-5px);
            border-color: #4ecdc4;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        
        .country-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        
        .country-flag {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        .places-panel {
            display: none;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
        }
        
        .places-panel.active {
            display: block;
        }
        
        .places-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .place-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
        }
        
        .place-name {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #fff;
        }
        
        .photo-gallery {
            position: relative;
            margin: 1rem 0;
        }
        
        .photo-container {
            display: flex;
            overflow: hidden;
            border-radius: 10px;
            position: relative;
        }
        
        .photo-slide {
            min-width: 100%;
            display: flex;
            gap: 0.5rem;
            transition: transform 0.3s ease;
        }
        
        .photo-item {
            flex: 1;
            height: 200px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .photo-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        
        .photo-nav:hover {
            background: rgba(0,0,0,0.9);
            transform: translateY(-50%) scale(1.1);
        }
        
        .photo-nav.prev {
            left: 10px;
        }
        
        .photo-nav.next {
            right: 10px;
        }
        
        .photo-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .coming-soon {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #ccc;
            font-style: italic;
        }
        
        .back-button {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        @media (max-width: 768px) {
            .travel-map-container {
                padding: 1rem;
            }
            
            .map-title {
                font-size: 2rem;
            }
            
            .world-map {
                height: 400px;
            }
            
            .continent {
                font-size: 1rem;
            }
            
            .asia { width: 80px; height: 80px; }
            .europe { width: 70px; height: 70px; }
            .africa { width: 80px; height: 80px; }
            .north-america { width: 90px; height: 90px; }
            .south-america { width: 70px; height: 70px; }
            .oceania { width: 60px; height: 60px; }
            .antarctica { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>
    <header class="glass-effect">
        <nav style="background:linear-gradient(90deg,#3a3f51 0%,#6a82fb 100%);">
            <div class="nav-container">
                <div class="nav-left">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="about.html" class="nav-link">About Me</a>
                    <a href="portfolio.html" class="nav-link">Portfolio</a>
                    <a href="contact.html" class="nav-link">Contact</a>
                </div>
                <div class="nav-right">
                    <button class="language-switch" onclick="switchLanguage()">
                        <span class="current-lang">EN</span>
                    </button>
                    <a href="https://www.instagram.com/louisalxt" target="_blank" class="social-icon">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/lxt/" target="_blank" class="social-icon">
                        <i class="fab fa-linkedin"></i>
                    </a>
                </div>
            </div>
        </nav>
    </header>
    
    <main>
        <div class="travel-map-container">
            <h1 class="map-title">
                <span class="en">My Travel Map</span>
                <span class="zh" style="display:none;">我的旅行地图</span>
            </h1>
            
            <div class="world-map">
                <div class="continent asia visited" data-continent="asia">
                    <span class="en">Asia</span>
                    <span class="zh" style="display:none;">亚洲</span>
                </div>
                <div class="continent europe visited" data-continent="europe">
                    <span class="en">Europe</span>
                    <span class="zh" style="display:none;">欧洲</span>
                </div>
                <div class="continent africa not-visited" data-continent="africa">
                    <span class="en">Africa</span>
                    <span class="zh" style="display:none;">非洲</span>
                </div>
                <div class="continent north-america not-visited" data-continent="north-america">
                    <span class="en">North America</span>
                    <span class="zh" style="display:none;">北美洲</span>
                </div>
                <div class="continent south-america not-visited" data-continent="south-america">
                    <span class="en">South America</span>
                    <span class="zh" style="display:none;">南美洲</span>
                </div>
                <div class="continent oceania not-visited" data-continent="oceania">
                    <span class="en">Oceania</span>
                    <span class="zh" style="display:none;">大洋洲</span>
                </div>
                <div class="continent antarctica not-visited" data-continent="antarctica">
                    <span class="en">Antarctica</span>
                    <span class="zh" style="display:none;">南极洲</span>
                </div>
            </div>
            
            <div class="countries-panel" id="countries-panel">
                <button class="back-button" onclick="showMap()">
                    <span class="en">← Back to Map</span>
                    <span class="zh" style="display:none;">← 返回地图</span>
                </button>
                <h2 id="continent-title"></h2>
                <div class="countries-grid" id="countries-grid"></div>
            </div>
            
            <div class="places-panel" id="places-panel">
                <button class="back-button" onclick="showCountries()">
                    <span class="en">← Back to Countries</span>
                    <span class="zh" style="display:none;">← 返回国家</span>
                </button>
                <h2 id="country-title"></h2>
                <div class="places-grid" id="places-grid"></div>
            </div>
        </div>
    </main>
    
    <footer class="glass-effect">
        <div class="footer-content">
            <p class="blessing">May your future be filled with endless possibilities</p>
            <p class="blessing-zh" style="display:none;">愿你得偿所愿</p>
            <p class="copyright">© 2025 Xingtong Lin. All rights reserved.</p>
        </div>
    </footer>
    
    <script src="js/main.js"></script>
    <script src="js/travel-map.js"></script>
</body>
</html>
